name: build

# 打 tag（如 v2.28）就自动出包并发 Release；
# 也能在 Actions 页面手动点一次，只出包不发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 装 Android SDK 组件
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 还原签名文件
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 Secret KEYSTORE_B64（yg.keystore 的 base64），无法用固定签名出包"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/yg.keystore
          ls -l app/yg.keystore

      - name: 校验 tag 与 versionName 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$TAG  versionName=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag（$TAG）与 build.gradle.kts 里的 versionName（$VER）不一致，请先改 versionName 再打 tag"
            exit 1
          fi

      - name: 构建 Release APK
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: 重命名产物并记录信息
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/YG影视TV.apk"
          cp app/build/outputs/apk/release/app-release.apk out/YGTV.apk
          ls -l out/
          md5sum "out/YG影视TV.apk"
          # assets 里只该有两个 txt（py/logo/live.json/sources.json 被 ignoreAssetsPattern 挡掉了）
          unzip -l out/YGTV.apk | grep 'assets/' || true
          echo "### 构建结果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          md5sum "out/YG影视TV.apk" | sed 's/  / /' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YGTV-apk
          path: |
            out/YG影视TV.apk
            out/YGTV.apk

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            自动构建发布于 ${{ github.event.head_commit.timestamp }}。

            电视/手机直接装 `YGTV.apk`。包名仍是 `com.yg.vodtv`、同一把签名，能从旧版原地覆盖升级。
          files: |
            out/YGTV.apk
          fail_on_unmatched_files: true
